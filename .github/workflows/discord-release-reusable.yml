name: Announce a GitHub release to Discord

on:
  workflow_call:
    secrets:
      FANTASTIQLABS_DISCORD_WEBHOOK:
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release card
        shell: bash
        env:
          FANTASTIQLABS_DISCORD_WEBHOOK: ${{ secrets.FANTASTIQLABS_DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PROJECT: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$FANTASTIQLABS_DISCORD_WEBHOOK" ]]; then
            echo "Fantastiq Labs Discord webhook secret is empty." >&2
            exit 1
          fi
          title="${RELEASE_NAME:-$RELEASE_TAG}"
          title="${title:0:240}"
          description="${RELEASE_BODY:0:3800}"
          if [[ -z "$description" ]]; then
            description="Release $RELEASE_TAG is available. See the release page for details."
          fi
          payload="$(jq -n \
            --arg project "$PROJECT" \
            --arg title "$title" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg description "$description" \
            '{embeds:[{title:$title,url:$url,description:$description,color:5793266,fields:[{name:"Project",value:$project,inline:true},{name:"Version",value:$tag,inline:true}],footer:{text:"GitHub release • deployment status is separate"}}],allowed_mentions:{parse:[]}}')"
          set +e
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "$FANTASTIQLABS_DISCORD_WEBHOOK" 2>/dev/null)"
          curl_status=$?
          set -e
          if [[ $curl_status -ne 0 || ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Discord release announcement failed (HTTP ${status:-no response}); webhook URL was withheld." >&2
            exit 1
          fi
