name: Select build runner

on:
  workflow_call:
    inputs:
      hosted_budget_minutes:
        type: string
        required: false
        default: '3000'
      hosted_reserve_minutes:
        type: string
        required: false
        default: '300'
    secrets:
      ACTIONS_BILLING_TOKEN:
        required: false
    outputs:
      runs_on:
        description: JSON value for the build job runs-on field
        value: ${{ jobs.select.outputs.runs_on }}

jobs:
  select:
    # Keep this control job on Unraid so it can route builds at zero hosted minutes.
    # The workflow that calls this job must use a trusted workflow definition.
    runs-on: [self-hosted, unraid, build]
    outputs:
      runs_on: ${{ steps.route.outputs.runs_on }}
    steps:
      - name: Set up Node.js for the billing check
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Select runner from schedule and billing usage
        id: route
        env:
          ACTIONS_BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}
          HOSTED_BUDGET_MINUTES: ${{ inputs.hosted_budget_minutes || '3000' }}
          HOSTED_RESERVE_MINUTES: ${{ inputs.hosted_reserve_minutes || '300' }}
          LINUX_MINUTE_RATE_USD: ${{ vars.ACTIONS_LINUX_MINUTE_RATE_USD || '0.006' }}
          HOSTED_TIMEZONE: ${{ vars.ACTIONS_HOSTED_TIMEZONE || 'Europe/Oslo' }}
          HOSTED_DAY_START: ${{ vars.ACTIONS_HOSTED_DAY_START || '09:00' }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const hosted = JSON.stringify('ubuntu-latest');
          const selfHosted = JSON.stringify(['self-hosted', 'unraid', 'build']);
          const monthlyBudgetMinutes = Number(process.env.HOSTED_BUDGET_MINUTES);
          const reserveMinutes = Number(process.env.HOSTED_RESERVE_MINUTES);
          const linuxMinuteRate = Number(process.env.LINUX_MINUTE_RATE_USD);
          // shortcut: keep a 300-minute reserve, add a shared coordinator if parallel runs exceed it.
          const timezone = process.env.HOSTED_TIMEZONE || 'Europe/Oslo';
          const dayStart = process.env.HOSTED_DAY_START || '09:00';
          const isForkPullRequest = process.env.EVENT_NAME === 'pull_request_target'
            && process.env.PR_HEAD_REPOSITORY !== process.env.GITHUB_REPOSITORY;

          function parseClock(value) {
            const match = /^(\d{2}):(\d{2})$/.exec(value);
            if (!match || Number(match[1]) > 23 || Number(match[2]) > 59) {
              throw new Error(`Invalid daytime start: ${value}`);
            }
            return Number(match[1]) * 60 + Number(match[2]);
          }

          function localMinuteOfDay(date, timeZone) {
            const parts = new Intl.DateTimeFormat('en-GB', {
              timeZone,
              hour: '2-digit',
              minute: '2-digit',
              hourCycle: 'h23',
            }).formatToParts(date);
            const values = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
            return Number(values.hour) * 60 + Number(values.minute);
          }

          async function main() {
            let runsOn = selfHosted;
            let reason = 'Using Unraid because billing routing is not configured.';
            let hostedHours = false;
            let scheduleError = '';
            try {
              hostedHours = localMinuteOfDay(new Date(), timezone) >= parseClock(dayStart);
            } catch (error) {
              scheduleError = error.message;
            }

            if (isForkPullRequest) {
              runsOn = hosted;
              reason = 'Fork pull requests use GitHub-hosted runners for isolation; this can use minutes outside the schedule.';
            } else if (!Number.isFinite(monthlyBudgetMinutes) || monthlyBudgetMinutes <= 0
                || !Number.isFinite(reserveMinutes) || reserveMinutes < 0
                || !Number.isFinite(linuxMinuteRate) || linuxMinuteRate <= 0) {
              reason = 'Using Unraid because the monthly minute budget is invalid.';
            } else if (scheduleError) {
              reason = `Using Unraid because the daytime schedule is invalid: ${scheduleError}`;
            } else if (!hostedHours) {
              reason = `Using Unraid outside hosted hours (${dayStart}–00:00 ${timezone}).`;
            } else if (!process.env.ACTIONS_BILLING_TOKEN) {
              reason = 'Using Unraid because ACTIONS_BILLING_TOKEN is not configured.';
            } else {
              try {
                const now = new Date();
                const query = new URLSearchParams({
                  year: String(now.getUTCFullYear()),
                  month: String(now.getUTCMonth() + 1),
                  product: 'Actions',
                });
                const response = await fetch(
                  `https://api.github.com/organizations/${process.env.GITHUB_OWNER}/settings/billing/usage/summary?${query}`,
                  {
                    headers: {
                      Accept: 'application/vnd.github+json',
                      Authorization: `Bearer ${process.env.ACTIONS_BILLING_TOKEN}`,
                      'X-GitHub-Api-Version': '2026-03-10',
                    },
                  },
                );
                if (!response.ok) throw new Error(`Billing API returned HTTP ${response.status}`);

                const report = await response.json();
                if (!Array.isArray(report.usageItems)) throw new Error('Billing report has no usageItems list');
                const minuteItems = report.usageItems.filter((item) =>
                  String(item.product).toLowerCase() === 'actions'
                  && String(item.unitType).toLowerCase() === 'minutes');
                const usedUsd = minuteItems.reduce((total, item) => {
                  const amount = Number(item.grossAmount);
                  if (item.grossAmount === undefined || item.grossAmount === null || !Number.isFinite(amount)) {
                    throw new Error('Billing item has no valid grossAmount');
                  }
                  return total + amount;
                }, 0);
                const budgetUsd = monthlyBudgetMinutes * linuxMinuteRate;
                const reserveUsd = reserveMinutes * linuxMinuteRate;
                const remainingMinutes = Math.max(0, (budgetUsd - usedUsd) / linuxMinuteRate);
                const usedMinutes = Math.max(0, usedUsd / linuxMinuteRate);
                const daysInMonth = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0)).getUTCDate();
                const spendableUsd = Math.max(0, budgetUsd - reserveUsd);
                const pacedTargetUsd = spendableUsd * now.getUTCDate() / daysInMonth;
                const usageSummary = `Estimated Actions use: ${Math.floor(usedMinutes)} of ${monthlyBudgetMinutes} Linux-equivalent minutes; ${Math.floor(remainingMinutes)} remain.`;

                if (remainingMinutes <= reserveMinutes) {
                  reason = `Using Unraid because only ${Math.floor(remainingMinutes)} Linux-equivalent minutes remain. ${usageSummary}`;
                } else if (usedUsd >= pacedTargetUsd) {
                  reason = `Using Unraid because Actions usage is at or above the monthly pace for day ${now.getUTCDate()}. ${usageSummary}`;
                } else {
                  runsOn = hosted;
                  reason = `Using GitHub-hosted runner during daytime and within the monthly pace. ${usageSummary}`;
                }
              } catch (error) {
                reason = `Using Unraid because the billing check failed: ${error.message}`;
              }
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `runs_on=${runsOn}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `**Build runner:** ${runsOn === hosted ? 'GitHub-hosted' : 'Unraid self-hosted'}\n\n${reason}\n`);
            console.log(reason);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
