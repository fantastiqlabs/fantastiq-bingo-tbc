name: Validate addon build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes lua5.4 python3
      - name: Validate Lua syntax
        run: for source in *.lua wow_forever/*.lua scripts/*.lua; do luac5.4 -p "$source"; done
      - name: Validate catalog
        run: lua5.4 validate_catalog.lua
      - name: Validate WoW Forever catalog
        run: lua5.4 scripts/validate_forever_catalog.lua
      - name: Test WoW Forever board generation and persistence
        run: lua5.4 scripts/test_forever_boards.lua
      - name: Test safe custom deck JSON import and export
        run: lua5.4 scripts/test_custom_decks.lua
      - name: Package addon
        run: python3 scripts/package.py --output dist
      - name: Verify addon package
        run: python3 scripts/verify.py "$(find dist -maxdepth 1 -name 'raid_bingo_addon_*.zip' -print -quit)" --target tbc
      - name: Package WoW Forever compatibility target
        run: python3 scripts/package.py --target forever --output dist
      - name: Verify WoW Forever package
        run: python3 scripts/verify.py "$(find dist -maxdepth 1 -name 'fantastiq_bingo_forever_*.zip' -print -quit)" --target forever
