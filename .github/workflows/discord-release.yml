  announce:
    uses: steffenlongva/agentastiq/.github/workflows/discord-release-reusable.yml@main
    secrets:
      FANTASTIQLABS_DISCORD_WEBHOOK: ${{ secrets.FANTASTIQLABS_DISCORD_WEBHOOK }}
